[package]
name = "notylo"
version = "0.1.1"
description = "A local-first notebook and whiteboard"
authors = ["Alexis"]
edition = "2021"

[lib]
name = "notylo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notylo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
