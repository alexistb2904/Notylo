name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            artifact: apps/desktop/src-tauri/target/release/bundle/**
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop run build:${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: notylo-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
