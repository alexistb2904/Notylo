name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: linux
            os: ubuntu-22.04
            artifact: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop run build:${{ matrix.name }}
      - uses: actions/upload-artifact@v6
        with:
          name: notylo-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: notylo-*
          path: release-assets
          merge-multiple: false
      - name: Collect packages and generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' file; do
            cp "$file" "dist/$(basename "$file")"
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Notylo $version" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
