name: Temporary resize pinch fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-format-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-format-live-resize
      - name: Clear resize preview when pinch takes over
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/EditorWorkspace.tsx")
          text = path.read_text()
          old = '''        if (eraserGestureRef.current?.result.before.length) finishEraserGesture();
        else eraserGestureRef.current = undefined;
        interactionPageRef.current = undefined;
        dragRef.current = undefined;
        setCanvasActive(false);'''
          new = '''        if (eraserGestureRef.current?.result.before.length) finishEraserGesture();
        else eraserGestureRef.current = undefined;
        if (dragRef.current?.kind === "resize") {
          clearResizePreview();
          resizePointRef.current = undefined;
        }
        interactionPageRef.current = undefined;
        dragRef.current = undefined;
        setCanvasActive(false);'''
          if old not in text:
            raise SystemExit("pinch takeover anchor missing")
          path.write_text(text.replace(old, new, 1))
      - run: git diff --check
      - name: Commit edge fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/components/EditorWorkspace.tsx
          git commit -m "Clear live resize preview when pinch takes over"
          git push origin HEAD:editor/text-format-live-resize
