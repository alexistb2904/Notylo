name: Temporary text resize patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-format-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-format-live-resize
      - name: Apply text formatting and live resize patch
        run: python scripts/apply_text_resize_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add packages/document-model/src/types.ts apps/web/src/lib/factories.ts apps/web/src/components/Inspector.tsx apps/web/src/components/VectorObjectLayer.tsx apps/web/src/components/EditorWorkspace.tsx apps/web/src/i18n/index.ts
          git commit -m "Add text formatting and live resize preview"
          git push origin HEAD:editor/text-format-live-resize
