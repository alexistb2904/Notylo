name: Temporary text resize patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-formatting-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-formatting-live-resize
      - name: Apply text formatting and live resize codemod
        run: python scripts/apply_text_resize_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add packages/document-model/src/types.ts \
            apps/web/src/components/CanvasLayer.tsx \
            apps/web/src/components/VectorObjectLayer.tsx \
            apps/web/src/components/EditorWorkspace.tsx \
            apps/web/src/styles.css \
            apps/web/src/i18n/index.ts
          git commit -m "Add rich text controls and live resize preview [text-resize-patch]"
          git push origin HEAD:editor/text-formatting-live-resize
