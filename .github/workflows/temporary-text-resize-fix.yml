name: Temporary text resize cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-format-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-format-live-resize
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/EditorWorkspace.tsx")
          text = path.read_text()
          replacements = [
            ('  const resizePreviewRef = useRef<readonly DocumentObject[] | undefined>(undefined);\n', ''),
            ('    (state: DragState, point: Point) => {\n      resizePointRef.current = point;', '    (point: Point) => {\n      resizePointRef.current = point;'),
            ('        resizePreviewRef.current = preview;\n        setResizePreview(preview);', '        setResizePreview(preview);'),
            ('    resizePreviewRef.current = undefined;\n    setResizePreview(undefined);', '    setResizePreview(undefined);'),
            ('      queueResizePreview(state, point);', '      queueResizePreview(point);'),
            ('        syncSelection();\n        setTool("select");\n      }', '        syncSelection();\n        setTool("select");\n        if (object.type === "text") setShowInspector(true);\n      }'),
            ('''              .map((object) => {\n                const renderedObject = resizePreviewById.get(object.id) ?? object;\n                return (\n                  <DOMObject\n                    key={object.id}\n                    object={renderedObject}''', '''              .map((object) => {\n                const renderedObject = resizePreviewById.get(object.id) ?? object;\n                if (renderedObject.type === "ink" || renderedObject.type === "shape") return null;\n                return (\n                  <DOMObject\n                    key={object.id}\n                    object={renderedObject}''')
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f"anchor missing: {old[:100]!r}")
            text = text.replace(old, new, 1)
          path.write_text(text)
      - run: git diff --check
      - name: Commit review fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/components/EditorWorkspace.tsx
          git commit -m "Fix live resize preview typing and cleanup"
          git push origin HEAD:editor/text-format-live-resize
