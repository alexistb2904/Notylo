name: Temporary i18n patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'i18n/browser-locale' && !contains(github.event.pull_request.head.label, 'dependabot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/browser-locale
      - name: Apply i18n codemod
        run: python scripts/apply_i18n_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/pages/HomePage.tsx apps/web/src/components/EditorWorkspace.tsx
          git commit -m "Localize home and editor workspace [i18n-patch]"
          git push origin HEAD:i18n/browser-locale
