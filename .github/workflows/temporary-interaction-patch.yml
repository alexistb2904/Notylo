name: Temporary interaction patch

on:
  push:
    branches:
      - fix/live-drag-zoom-stabilizer-mobile-settings

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[interaction-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-drag-zoom-stabilizer-mobile-settings
      - name: Patch EditorWorkspace
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/components/EditorWorkspace.tsx")
          text = path.read_text()

          replacements = [
              (
                  '  const [dragOffset, setDragOffset] = useState<Point>({ x: 0, y: 0 });\n',
                  '  const [dragOffset, setDragOffset] = useState<Point>({ x: 0, y: 0 });\n'
                  '  const dragOffsetRef = useRef<Point>({ x: 0, y: 0 });\n'
                  '  const dragFrameRef = useRef<number | undefined>(undefined);\n'
              ),
              (
                  '      const timer = straightenGestureRef.current?.timer;\n'
                  '      if (timer !== undefined) window.clearTimeout(timer);\n',
                  '      const timer = straightenGestureRef.current?.timer;\n'
                  '      if (timer !== undefined) window.clearTimeout(timer);\n'
                  '      if (dragFrameRef.current !== undefined)\n'
                  '        window.cancelAnimationFrame(dragFrameRef.current);\n'
              ),
              (
                  '  const syncSelection = useCallback(() => setSelectedIds(engine.current.selection), []);\n',
                  '  const syncSelection = useCallback(() => setSelectedIds(engine.current.selection), []);\n'
                  '  const queueDragOffset = useCallback((offset: Point) => {\n'
                  '    dragOffsetRef.current = offset;\n'
                  '    if (dragFrameRef.current !== undefined) return;\n'
                  '    dragFrameRef.current = window.requestAnimationFrame(() => {\n'
                  '      dragFrameRef.current = undefined;\n'
                  '      setDragOffset(dragOffsetRef.current);\n'
                  '    });\n'
                  '  }, []);\n'
                  '  const resetDragOffset = useCallback(() => {\n'
                  '    if (dragFrameRef.current !== undefined)\n'
                  '      window.cancelAnimationFrame(dragFrameRef.current);\n'
                  '    dragFrameRef.current = undefined;\n'
                  '    dragOffsetRef.current = { x: 0, y: 0 };\n'
                  '    setDragOffset({ x: 0, y: 0 });\n'
                  '  }, []);\n'
              ),
              (
                  '        smoothing: inkSmoothing,\n'
                  '        brushId: isShapeDrawing ? "ink-fineliner" : brushId,\n',
                  '        smoothing: inkSmoothing,\n'
                  '        captureZoom: cameraRef.current.zoom,\n'
                  '        brushId: isShapeDrawing ? "ink-fineliner" : brushId,\n'
              ),
              (
                  '      syncSelection();\n'
                  '      dragRef.current = {\n'
                  '        kind: "move",\n',
                  '      syncSelection();\n'
                  '      resetDragOffset();\n'
                  '      dragRef.current = {\n'
                  '        kind: "move",\n'
              ),
              (
                  '      state.kind === "lasso" ||\n'
                  '      state.kind === "pan"\n',
                  '      state.kind === "lasso" ||\n'
                  '      state.kind === "pan" ||\n'
                  '      state.kind === "move"\n'
              ),
              (
                  '    if (state.kind === "move") {\n'
                  '      setDragOffset({ x: point.x - state.start.x, y: point.y - state.start.y });\n'
                  '      return;\n'
                  '    }\n',
                  '    if (state.kind === "move") {\n'
                  '      queueDragOffset({ x: point.x - state.start.x, y: point.y - state.start.y });\n'
                  '      return;\n'
                  '    }\n'
              ),
              (
                  '          smoothing: draft.smoothing,\n'
                  '          brushId: draft.brushId,\n',
                  '          smoothing: draft.smoothing,\n'
                  '          captureZoom: draft.captureZoom,\n'
                  '          brushId: draft.brushId,\n'
              ),
              (
                  '    if (state.kind === "move" && state.originals) {\n'
                  '      const offset = dragOffset;\n',
                  '    if (state.kind === "move" && state.originals) {\n'
                  '      const offset = dragOffsetRef.current;\n'
              ),
              (
                  '      setDragOffset({ x: 0, y: 0 });\n'
                  '    }\n'
                  '    if (\n'
                  '      state.kind === "resize"',
                  '      resetDragOffset();\n'
                  '    }\n'
                  '    if (\n'
                  '      state.kind === "resize"'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "notylo-ci"
          git config user.email "notylo-ci@users.noreply.github.com"
          git add apps/web/src/components/EditorWorkspace.tsx
          git diff --cached --check
          git commit -m "[interaction-patch] Smooth live object dragging and capture ink zoom"
          git push origin HEAD:fix/live-drag-zoom-stabilizer-mobile-settings
