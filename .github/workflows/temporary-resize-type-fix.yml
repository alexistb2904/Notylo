name: Temporary resize type fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-formatting-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-formatting-live-resize
      - name: Narrow DOM preview object type
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/EditorWorkspace.tsx")
          text = path.read_text()
          old = '''                const displayObject = previewById.get(object.id) ?? object;'''
          new = '''                const displayObject = (previewById.get(object.id) ?? object) as Exclude<
                  DocumentObject,
                  { readonly type: "ink" | "shape" }
                >;'''
          if old not in text:
              raise SystemExit("DOM preview type anchor missing")
          path.write_text(text.replace(old, new, 1))
      - run: git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/components/EditorWorkspace.tsx
          git commit -m "Narrow live resize DOM preview type [resize-type-fix]"
          git push origin HEAD:editor/text-formatting-live-resize
