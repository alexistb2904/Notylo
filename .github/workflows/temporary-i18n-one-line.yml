name: Temporary final i18n fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'i18n/browser-locale' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/browser-locale
      - name: Replace final hardcoded cancel label
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/pages/HomePage.tsx")
          text = path.read_text()
          old = '''              <button className="text-button" onClick={() => setConfirmDelete(false)}>
                Annuler
              </button>'''
          new = '''              <button className="text-button" onClick={() => setConfirmDelete(false)}>
                {t("common.cancel")}
              </button>'''
          if old not in text:
              raise SystemExit("final cancel anchor missing")
          path.write_text(text.replace(old, new, 1))
      - run: git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/pages/HomePage.tsx
          git commit -m "Localize final delete confirmation label [i18n-fix]"
          git push origin HEAD:i18n/browser-locale
