name: Temporary resize fresh snapshot fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'editor/text-format-live-resize' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/text-format-live-resize
      - name: Use fresh document snapshot for resize
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/EditorWorkspace.tsx")
          text = path.read_text()
          old = "originals: selectedObjects,"
          new = "originals: props.documentRef.current.objects.filter((object) => selectedIds.includes(object.id)),"
          if text.count(old) != 1:
            raise SystemExit(f"expected one resize originals anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
      - run: git diff --check
      - name: Commit fresh snapshot fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "notylo-bot"
          git config user.email "notylo-bot@users.noreply.github.com"
          git add apps/web/src/components/EditorWorkspace.tsx
          git commit -m "Use fresh document state when resize starts"
          git push origin HEAD:editor/text-format-live-resize
